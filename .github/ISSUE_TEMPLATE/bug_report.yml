name: Bug 报告
description: 报告可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请不要上传真实 Cookie、证书、SQLite 数据库、完整日志或带临时参数的 URL。提交前建议先阅读 doc/security_zh.md。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 说明你遇到了什么问题。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请按步骤写明如何复现。
      placeholder: |
        1. 打开...
        2. 点击...
        3. 看到...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 23H2
  - type: input
    id: python
    attributes:
      label: Python 与 uv 版本
      placeholder: Python 3.13.x / uv x.x.x
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志
      description: 只粘贴必要片段，并移除 key、pass_ticket、appmsg_token、Cookie 等敏感内容。
      render: text

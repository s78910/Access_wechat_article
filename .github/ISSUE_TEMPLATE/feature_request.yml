name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 这个功能要解决什么实际问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望它如何工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可替代方案
      description: 目前是否有临时解决方式？
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 主服务采集
        - 代理和证书
        - 数据档案
        - 文章缓存
        - Excel 导出
        - 系统配置
        - 文档和测试
        - 其他

# 用户可修改配置。修改后重启软件生效。

# 内容自动保存：true 时，mitm 捕获到文章列表后写入 SQLite。
auto_save_content: true

# 自动清理临时文件：true 时，程序启动后清理 data/tmp/ 中上次遗留的临时文件。
auto_clean_temp_files: true

# 开启代理：true 时，打开软件后自动启动 mitm 监听。
auto_start_proxy: true

# 当前开发版本号，供主服务页运行环境区域显示。
# log_level: DEBUG 最详细；INFO 默认；WARN 仅警告和错误；ERROR 仅错误。
log_level: INFO

# 请求间隔时间：每篇文章处理完成后，进入下一篇前等待的秒数。
request_interval_seconds: 0

# 重试次数：单篇文章失败后最多额外重试次数；0 表示不重试。
retry_count: 3

version: 2.0.1

# 系统代理：true 时，开启代理后自动接管系统代理；软件关闭时恢复原代理。
enable_system_proxy: false

proxy:
  host: localhost
  port: 18000
  startup_delay_seconds: 0
  verification_url: 'http://mitm.it/'
  confdir: ../.mitmproxy
  ssl_insecure: true

storage:
  db_path: awa_public.sqlite3

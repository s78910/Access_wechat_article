software:
  version: 2.1.1
basic_settings:
  # 运行维护：日志、临时文件清理和请求控制。
  runtime_maintenance:
    log_level: INFO  # 日志级别：DEBUG / INFO / WARN / ERROR。
    auto_clean_temp_files: true  # 启动时是否自动清理临时文件。
    temp_retention_days: 7  # 临时文件保留天数。
    log_retention_days: 30  # 日志文件保留天数。
    request_interval_seconds: 0.0  # 请求/文章处理间隔；原 request.request_interval_seconds。

  # 项目存储：业务文件、临时文件和日志目录。
  project_storage:
    article_storage_root: storages  # 文章归档根目录；原 storage.article_storage_root。
    temp_dir: data/tmp  # 临时文件目录；原 storage.temp_dir。
    log_dir: data/logs  # 日志目录；原 storage.log_dir。

  # 数据库设置：数据表结构版本和 SQLite 数据库目录。
  database_settings:
    data_schema_version: v2.1  # 当前数据表结构版本；原 software.data_schema_version。
    db_dir: data/sql  # SQLite 数据库目录；原 storage.db_dir。
proxy_settings:
  # 基础信息：MITM 监听地址、端口、证书和验证页面。
  basic_info:
    host: 127.0.0.1  # MITM 监听地址；原 proxy.host。
    port: 18000  # MITM 监听端口；原 proxy.port。
    verification_url: https://mitm.it/  # 代理证书验证/安装页面；原 proxy.verification_url。
    confdir: .mitmproxy  # mitmproxy 配置目录；原 proxy.confdir。
    ca_cert_path: .mitmproxy/mitmproxy-ca-cert.cer  # CA 证书路径；原 proxy.ca_cert_path。
    startup_delay_seconds: 0.0  # 代理启动后的额外等待时间；原 proxy.startup_delay_seconds。
    enable_system_proxy: true  # 是否接管系统代理；原 proxy.enable_system_proxy。
    ssl_insecure: true  # 是否允许 MITM 连接上游 HTTPS 时忽略证书校验；原 proxy.ssl_insecure。

  # 代理进程控制：父进程、子进程、listener 和清理阶段的超时/轮询设置。
  process_control:
    ready_timeout_seconds: 10.0  # 父进程等待 MITM READY 的最大时长；原 mitm_capture.ready_timeout_seconds。
    capture_timeout_seconds: 20.0  # 子进程 READY 后等待 STOP_CAPTURE 的最大时长；原 mitm_capture.capture_timeout_seconds。
    result_timeout_seconds: 11.0  # 父进程发送 STOP_CAPTURE 后等待 RESULT/FAILED 的最大时长。
    listener_shutdown_timeout_seconds: 3.0  # MITM listener 关闭超时。
    cancel_grace_seconds: 1.0  # 取消时等待子进程正常退出的时间；当前源码默认值为 1.0。
    terminate_grace_seconds: 1.0  # terminate/kill 后等待退出的时间；当前源码默认值为 1.0。
    start_capture_message_timeout_seconds: 30.0  # 子进程启动后等待 START_CAPTURE 的兜底超时；当前源码固定为 30.0。
    fallback_capture_timeout_seconds: 60.0  # 子进程兜底捕获超时；正常会被 START_CAPTURE 里的 capture_timeout_seconds 覆盖。
    listener_ready_poll_interval_seconds: 0.02  # 子进程检测 MITM 端口是否可连接的轮询间隔；当前源码固定为 0.02。
    stop_capture_poll_interval_seconds: 0.05  # 子进程等待 STOP_CAPTURE 命令时的轮询间隔；当前源码默认值为 0.05。
    close_as_capture_deadline: true  # 关闭文章标签作为本次捕获截止点；原 mitm_capture.close_as_capture_deadline 默认值。
windows_command:
  # 单篇标签操作：从点击文章后检测标题，到关闭文章标签并回到主页。
  single_article_tab:
    article_title_stable_delay_seconds: 0.1  # 检测到目标文章标签标题后，再等待 0.1 秒确认标题稳定；等待结束后立即关闭文章标签。
    article_open_timeout_seconds: 12.0  # 点击文章后等待详情页打开的最大时长；超过仍未识别到目标标题则认为打开失败。
    article_title_poll_initial_interval_seconds: 0.05  # 等待文章标题时的初始轮询间隔；当前由源码固定为 0.05 秒。
    article_title_poll_interval_seconds: 0.15  # 等待文章标题时的最大轮询间隔；原 window.article_title_poll_interval_seconds。
    article_title_poll_growth_factor: 1.5  # 标题轮询间隔按 1.5 倍逐步放大，不是每次固定增加 0.05 秒。
    article_close_confirm_timeout_seconds: 3.0  # 关闭文章标签后，最多等待 3 秒确认窗口标题变化或标签消失。
    article_close_title_poll_interval_seconds: 0.05  # 关闭文章标签后检测标题变化的轮询间隔；当前由源码固定为 0.05 秒。
    restore_focus_after_close: true  # 关闭文章标签后恢复/聚焦到公众号主页窗口；原 window.restore_focus_after_close。

  # 主页窗口操作：主页激活、点击动作内部等待，以及点击前后 MITM 相关等待。
  home_window:
    activation_wait_seconds: 0.05  # 激活公众号主页窗口后的等待时间，避免窗口尚未稳定就执行点击；原 window.activation_wait_seconds。
    home_find_timeout_seconds: 3.0  # 诊断工具定位微信主页窗口的最大时长；超过后直接提示用户打开公众号主页。
    home_find_use_article_probe: false  # 激活主页诊断是否读取文章卡片辅助识别；关闭后优先快速按窗口特征定位。
    mitm_ready_timeout_seconds: 10.0  # 点击文章前等待 MITM 进入 READY 状态的最大时长；对应 mitm_capture.ready_timeout_seconds。
    mitm_capture_timeout_seconds: 20.0  # MITM 捕获文章请求的最大时长；对应 mitm_capture.capture_timeout_seconds。
    mitm_result_timeout_seconds: 11.0  # 停止 MITM 后等待结果的参考值；实际运行以 proxy_settings.process_control.result_timeout_seconds 为准。
    mitm_shutdown_timeout_seconds: 3.0  # MITM 子进程关闭超时的参考值；实际运行以 proxy_settings.process_control.listener_shutdown_timeout_seconds 为准。
    click_mouse_move_wait_seconds: 0.02  # 发送鼠标移动消息后的短暂停顿；当前由源码固定。
    click_mouse_down_wait_seconds: 0.04  # 发送鼠标按下消息后的短暂停顿；当前由源码固定。
    click_mouse_up_wait_seconds: 0.25  # 发送鼠标释放消息后等待 Chromium 开始处理导航；当前由源码固定。
    screen_click_wait_seconds: 0.3  # 走 uiautomation 坐标点击时的等待时间；当前由源码固定。
    uia_control_click_wait_seconds: 0.0  # 走 UIA 控件 Click 时不额外等待；当前 waitTime=0。

  # 主页滚动操作：找下一篇文章、检测页面变化、懒加载等待和回弹滚动。
  home_scroll:
    max_scroll_attempts: 6  # 找下一篇文章时最多向下滚动 6 轮；原 window.max_scroll_attempts。
    scroll_wheel_steps: 5  # 普通向下滚动步长；这是滚轮消息步数，不是像素或文章数量；原 window.scroll_wheel_steps。
    scroll_initial_delay_seconds: 0.05  # 每次滚动后先等待 0.05 秒，再开始读取页面；原 window.scroll_initial_delay_seconds。
    scroll_probe_interval_seconds: 0.1  # 滚动后检查页面变化的初始轮询间隔；原 window.scroll_probe_interval_seconds。
    scroll_probe_max_interval_seconds: 0.4  # 滚动后检查页面变化的最大轮询间隔；原 window.scroll_probe_max_interval_seconds。
    scroll_probe_growth_factor: 1.5  # 滚动轮询间隔按 1.5 倍逐步放大，不是每次固定增加 0.05 秒。
    scroll_settle_timeout_seconds: 1.2  # 页面稳定判断的保守上限；当前普通无变化场景会被 0.6 秒提前截断；原 window.scroll_settle_timeout_seconds。
    unchanged_before_bounce_seconds: 0.6  # 滚动后 0.6 秒内页面无变化，则认为本次滚动无效并准备触发回弹；原 window.unchanged_before_bounce_seconds。
    lazy_load_timeout_seconds: 3.0  # 如果检测到页面处于“正在加载/加载中”状态，最多等待 3 秒；原 window.lazy_load_timeout_seconds。
    visible_snapshot_max_age_seconds: 60.0  # 当前可见文章快照最多缓存 60 秒；这是缓存有效期，不是主动等待时间；原 window.visible_snapshot_max_age_seconds。
    bounce_enabled: true  # 是否启用回弹滚动；原 window.bounce_enabled。
    bounce_up_steps: 2  # 回弹时先向上滚动 2 步；原 window.bounce_up_steps。
    bounce_pause_seconds: 0.2  # 回弹上滚后等待 0.2 秒，再向下滚动；原 window.bounce_pause_seconds。
    bounce_down_steps: 6  # 回弹时再向下滚动 6 步；原 window.bounce_down_steps。
    bounce_attempts: 2  # 每轮寻找候选文章时，最多尝试 2 次回弹；原 window.bounce_attempts。
data_acquisition:
  # 原 HTML 请求：使用 reference 参数重新请求文章 HTML 时的超时设置。
  reference_request:
    request_timeout_seconds: 10.0  # 单次 reference 请求文章 HTML 的最长等待时间。

  # 评论采集：控制首页默认是否采集评论，以及评论接口请求、分页节奏和页数上限。
  comment_collection:
    enabled_by_default: false  # 默认评论采集开关；开启后首页应默认勾选评论采集。
    request_timeout_seconds: 10.0  # 每一次评论 HTTP 请求最多等待 10 秒，不是整篇文章评论采集总耗时。
    page_interval_seconds: 0.5  # 评论分页之间的等待时间，避免连续请求过快。
    top_level_max_pages: 50  # 一级评论最多请求 50 页。
    reply_max_pages: 50  # 回复评论最多请求 50 页；当前代码尚需后续适配才能和一级评论页数分开生效。
    max_concurrent_processes: 3  # 评论采集独立子进程的最大并发数；超过 3 篇时排队等待空闲槽位。

  # 离线缓存：控制离线页面缓存时的滚动加载范围和单个资源下载超时。
  offline_cache:
    enabled_by_default: false  # 默认离线归档开关；开启后主服务页默认勾选离线归档，具体任务仍以前端当前开关为准。
    max_scroll_seconds: 30.0  # 离线缓存时最长滚动加载时间。
    max_scroll_count: 30  # 离线缓存时最大滚动次数。
    resource_timeout_seconds: 10.0  # 单个资源下载超时。
    max_concurrent_processes: 3  # 同时运行的 Playwright 离线缓存子进程上限。
